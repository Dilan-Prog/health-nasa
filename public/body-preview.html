<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figura anatómica interactiva · Monitor de salud</title>
<style>
  :root{
    --navy:#071E4A; --blue:#0B3D91; --blue-2:#1B58B8; --red:#FC3D21;
    --ok:#2E9E5B; --warn:#F59E0B; --crit:#D92D20;
    --ink:#0F1B33; --mute:#5B6B88; --line:#E3E9F4; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);
       background:linear-gradient(180deg,var(--navy),var(--blue) 70%);min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;color:#fff;
         border-bottom:1px solid rgba(255,255,255,.14)}
  header .brand{display:flex;gap:12px;align-items:center}
  header .logo{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;
               color:var(--blue);font-weight:800;font-size:13px}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
  header small{opacity:.75;font-size:12px}
  .switch{font:600 12px inherit;font-family:inherit;color:#fff;background:transparent;border:1px solid var(--red);
          border-radius:999px;padding:6px 12px;cursor:pointer;opacity:.9}
  .switch:hover{background:var(--red)}
  main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1fr);gap:20px;padding:24px 28px;max-width:1200px;margin:0 auto}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:16px;box-shadow:0 8px 28px rgba(3,15,45,.35)}
  .figure-card{padding:18px 18px 14px;display:flex;flex-direction:column;align-items:center;position:relative}
  .profile{width:100%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
           padding-bottom:12px;border-bottom:1px solid var(--line)}
  .profile h2{margin:0;font-size:18px;color:var(--navy)}
  .profile p{margin:2px 0 0;color:var(--mute);font-size:13px}
  .stats{display:flex;gap:14px;font-size:12px;color:var(--mute)}
  .stats b{display:block;color:var(--ink);font-size:15px}
  .tabs{display:flex;gap:6px;margin:12px 0 2px;background:#EEF3FB;padding:4px;border-radius:999px}
  .tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font:600 13px inherit;font-family:inherit;color:var(--mute);cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--blue);color:#fff}
  svg.body{width:100%;max-width:340px;height:auto;display:block}
  svg.body[hidden]{display:none}
  .tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:6px 10px;
       border-radius:8px;opacity:0;transform:translateY(4px);transition:.15s;white-space:nowrap;z-index:5}
  .tip.on{opacity:1;transform:none}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .list{display:flex;flex-direction:column;gap:10px}
  .ind{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 0;
       cursor:pointer;border:2px solid transparent;transition:.2s;overflow:hidden}
  .ind:hover,.ind.active{border-color:var(--c)}
  .ind .bar{align-self:stretch;background:var(--c);border-radius:16px 0 0 16px}
  .ind h3{margin:0;font-size:13px;color:var(--mute);font-weight:600}
  .ind .val{font-size:22px;font-weight:800;color:var(--navy)}
  .ind .val small{font-size:12px;color:var(--mute);font-weight:600;margin-left:4px}
  .ind p{margin:4px 0 0;font-size:12.5px;color:#33415E;line-height:1.35}
  .badge{font-size:11px;font-weight:700;color:#fff;background:var(--c);padding:4px 9px;border-radius:999px;white-space:nowrap}
  .note{color:#C9D6F0;font-size:11.5px;text-align:center;margin:6px 0 20px}

  /* —— anatomía —— */
  .skin{fill:#D3DAE6;stroke:#7F8CA6;stroke-width:1.6;stroke-linejoin:round}
  .mu{fill:url(#mg);stroke:#9AA5B8;stroke-width:1.1;stroke-linejoin:round}
  .ln{fill:none;stroke:#9AA5B8;stroke-width:1.1;stroke-linecap:round}
  .zf{fill:var(--zc);fill-opacity:.72;stroke:#fff;stroke-width:1}
  .zs{fill:none;stroke:var(--zc);stroke-opacity:.85;stroke-linecap:round}
  .halo{fill:none;stroke:var(--zc);stroke-width:2.4;stroke-opacity:.55;stroke-linejoin:round;pointer-events:stroke}
  .band{fill:var(--zc);fill-opacity:.22;stroke:var(--zc);stroke-width:1.6;stroke-dasharray:5 3}
  .zone{cursor:pointer;transition:filter .25s}
  .zone:hover,.zone.active,.zone:focus-visible{filter:drop-shadow(0 0 6px var(--zc));outline:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  {zone:'bone',    view:'front', name:'Salud ósea', value:'−4.5', unit:'% vs línea base', status:'warn',
   tip:'Pérdida moderada. Cumple la rutina de ejercicio de resistencia (2 sesiones hoy).'},
  {zone:'glucose', view:'front', name:'Glucosa en sangre', value:'92', unit:'mg/dL', status:'ok',
   tip:'Dentro del rango normal. Mantén tu plan de nutrición.'},
  {zone:'bmi',     view:'front', name:'Índice de masa corporal', value:'21.6', unit:'kg/m²', status:'ok',
   tip:'Peso saludable. Continúa con el seguimiento semanal.'}
];

const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const tip = $('#tip'), card = $('#figureCard');
let current = 'front';

// Pinta cada zona con el color de su estado
DATA.forEach(d => $$(`[data-zone="${d.zone}"]`).forEach(el => el.style.setProperty('--zc', COLORS[d.status])));

// Tarjetas
const list = $('#list');
DATA.forEach(d => {
  const el = document.createElement('article');
  el.className = 'card ind'; el.dataset.zone = d.zone; el.style.setProperty('--c', COLORS[d.status]);
  el.tabIndex = 0;
  el.innerHTML = `<div class="bar"></div>
    <div><h3>${d.name}</h3><div class="val">${d.value}<small>${d.unit}</small></div><p>${d.tip}</p></div>
    <span class="badge">${LABEL[d.status]}</span>`;
  list.appendChild(el);
});

function setView(v){
  current = v;
  $('#v-front').toggleAttribute('hidden', v !== 'front'); $('#v-back').toggleAttribute('hidden', v !== 'back');
  $$('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
}
function select(zone, {switchView=false} = {}){
  $$('.zone.active').forEach(e => e.classList.remove('active'));
  $$('.ind.active').forEach(e => e.classList.remove('active'));
  const inView = $$(`#v-${current} [data-zone="${zone}"]`).length > 0;
  if (!inView && switchView) setView(current === 'front' ? 'back' : 'front');
  $$(`#v-${current} [data-zone="${zone}"]`).forEach(e => e.classList.add('active'));
  const c = $(`.ind[data-zone="${zone}"]`); if (c) c.classList.add('active');
}

$$('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$$('.ind').forEach(c => {
  const go = () => select(c.dataset.zone, {switchView:true});
  c.addEventListener('click', go); c.addEventListener('keydown', e => (e.key==='Enter'||e.key===' ') && (e.preventDefault(), go()));
});
$$('.zone').forEach(z => {
  const d = DATA.find(x => x.zone === z.dataset.zone);
  z.addEventListener('click', () => select(z.dataset.zone));
  z.addEventListener('keydown', e => (e.key==='Enter'||e.key===' ') && (e.preventDefault(), select(z.dataset.zone)));
  z.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    tip.textContent = `${d.name}: ${d.value} ${d.unit} · ${LABEL[d.status]}`;
    tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 220) + 'px';
    tip.style.top  = (e.clientY - r.top + 14) + 'px';
    tip.classList.add('on');
  });
  z.addEventListener('pointerleave', () => tip.classList.remove('on'));
});
</script>
</body>
</html>
